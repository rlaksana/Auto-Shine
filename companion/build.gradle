plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.mine.autoshine.companion'
    compileSdk 35

    defaultConfig {
        applicationId "com.mine.autoshine.companion"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        archivesBaseName = applicationId
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
